name: customer_display_android
description: "SELFX secure customer QR display."
publish_to: 'none'

version: 1.1.5+16

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.3
  wakelock_plus: ^1.7.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mainlogo.png
